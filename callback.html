<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6;color:#1a1a1a;background:#fff}h1{font-size:28px}h2{font-size:19px;margin-top:28px}a{color:#e0284f}nav a{margin-right:16px}code{background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}</style><title>Authorization</title></head><body><nav><a href="./">Home</a><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></nav>
<h1>TikTok authorization</h1><div id="r">Reading result&hellip;</div>
<script>
var p=new URLSearchParams(location.search),r=document.getElementById('r');
var webState=sessionStorage.getItem('vd_oauth_state');
var HELPER=sessionStorage.getItem('vd_helper')||'http://127.0.0.1:8765';
if(p.get('error')){r.textContent='Authorization failed: '+p.get('error')+' '+(p.get('error_description')||'');if(webState){r.innerHTML+='<p><a href="publish.html">Back to Publish</a></p>';}}
else if(p.get('code')&&webState&&p.get('state')===webState){
  // Started from publish.html: hand the code to the local publishing service, which holds the client secret.
  r.textContent='Connecting your TikTok account\u2026';
  sessionStorage.removeItem('vd_oauth_state');
  fetch(HELPER+'/auth/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:p.get('code'),state:p.get('state')})})
   .then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error((j.error&&j.error.message)||('HTTP '+x.status));return j;});})
   .then(function(j){sessionStorage.setItem('vd_session',j.session);location.replace('publish.html');})
   .catch(function(e){r.innerHTML='<p></p><p><a href="publish.html">Back to Publish</a></p>';r.firstChild.textContent='Could not finish connecting: '+e.message;});
}
else if(p.get('code')){r.innerHTML='<p>Authorization succeeded. Copy this whole address and send it back to finish connecting:</p><p><code></code></p>';r.querySelector('code').textContent=location.href;}
else{r.textContent='No authorization result in this address.';}
</script></body></html>
